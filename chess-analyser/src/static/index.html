<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Stats</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      padding: 32px 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 28px;
      color: #fff;
    }

    /* ── Stat cards ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 32px;
    }

    .card {
      background: #1a1a2e;
      border-radius: 10px;
      padding: 18px 20px;
      border: 1px solid #2a2a40;
    }
    .card-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #888;
      margin-bottom: 6px;
    }
    .card-value {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
    }
    .card-value span { font-size: 1rem; color: #aaa; font-weight: 400; }

    /* ── Insight cards ── */
    .insights {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .insight {
      background: #1a1a2e;
      border-radius: 10px;
      padding: 16px 18px;
      border: 1px solid #2a2a40;
    }
    .insight-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #888;
      margin-bottom: 6px;
    }
    .insight-name  { font-size: 1rem; font-weight: 600; color: #fff; margin-bottom: 2px; }
    .insight-sub   { font-size: 0.8rem; color: #888; }
    .insight-value { font-size: 1.4rem; font-weight: 700; }
    .insight-value.good { color: #4ade80; }
    .insight-value.bad  { color: #f87171; }

    /* ── Charts ── */
    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 640px) { .charts { grid-template-columns: 1fr; } }

    .chart-box {
      background: #1a1a2e;
      border-radius: 10px;
      padding: 20px;
      border: 1px solid #2a2a40;
    }
    .chart-box.wide { grid-column: 1 / -1; }
    .chart-box h2 {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #888;
      margin-bottom: 16px;
    }
    canvas { width: 100% !important; }

    #loading {
      text-align: center;
      color: #666;
      margin-top: 60px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <h1>Chess Stats Dashboard</h1>
  <div id="loading">Loading your games...</div>

  <div id="app" style="display:none">

    <!-- Stat cards -->
    <div class="cards">
      <div class="card">
        <div class="card-label">Total Games</div>
        <div class="card-value" id="c-total">—</div>
      </div>
      <div class="card">
        <div class="card-label">Win Rate</div>
        <div class="card-value" id="c-winrate">—<span>%</span></div>
      </div>
      <div class="card">
        <div class="card-label">As White</div>
        <div class="card-value" id="c-white">—<span>%</span></div>
      </div>
      <div class="card">
        <div class="card-label">As Black</div>
        <div class="card-value" id="c-black">—<span>%</span></div>
      </div>
    </div>

    <!-- Insight cards: best + worst opening -->
    <div class="insights" id="insights" style="display:none"></div>

    <!-- Charts -->
    <div class="charts">
      <div class="chart-box">
        <h2>Overall Record</h2>
        <canvas id="chart-overall"></canvas>
      </div>
      <div class="chart-box">
        <h2>Win Rate by Colour</h2>
        <canvas id="chart-color"></canvas>
      </div>
      <div class="chart-box wide">
        <h2>Win Rate Over Time</h2>
        <canvas id="chart-time"></canvas>
      </div>
      <div class="chart-box wide">
        <h2>Top Openings — Wins / Draws / Losses</h2>
        <canvas id="chart-openings"></canvas>
      </div>
      <div class="chart-box">
        <h2>By Time Control</h2>
        <canvas id="chart-tc"></canvas>
      </div>
    </div>
  </div>

  <script>
    const C = {
      win:    '#4ade80',
      draw:   '#facc15',
      loss:   '#f87171',
      blue:   '#60a5fa',
      purple: '#a78bfa',
      winBg:  'rgba(74,222,128,0.15)',
    };

    const BASE_OPTS = {
      plugins: { legend: { labels: { color: '#ccc', font: { size: 12 } } } },
      scales: {
        x: { ticks: { color: '#999' }, grid: { color: '#1f1f30' } },
        y: { ticks: { color: '#999' }, grid: { color: '#1f1f30' } }
      }
    };

    function chart(id, type, data, extra = {}) {
      return new Chart(document.getElementById(id), {
        type,
        data,
        options: { responsive: true, ...BASE_OPTS, ...extra }
      });
    }

    function pct(scale) {
      return { ...scale, ticks: { ...scale.ticks, callback: v => v + '%' }, max: 100 };
    }

    fetch('/api/stats')
      .then(r => r.json())
      .then(d => {
        if (!d.total_games) {
          document.getElementById('loading').textContent =
            'No games found. Run fetch.py first.';
          return;
        }

        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = 'block';

        // ── Cards ─────────────────────────────────────────────────────────
        document.getElementById('c-total').innerHTML   = d.total_games + '<span> games</span>';
        document.getElementById('c-winrate').innerHTML = d.win_rate + '<span>%</span>';
        document.getElementById('c-white').innerHTML   = (d.by_color?.white?.win_rate ?? '—') + '<span>%</span>';
        document.getElementById('c-black').innerHTML   = (d.by_color?.black?.win_rate ?? '—') + '<span>%</span>';

        // ── Insight cards (best / worst opening, min 5 games) ─────────────
        const op = d.top_openings || [];
        const qualified = op.filter(o => o.total >= 5);
        if (qualified.length >= 2) {
          const best  = [...qualified].sort((a, b) => b.win_rate - a.win_rate)[0];
          const worst = [...qualified].sort((a, b) => a.win_rate - b.win_rate)[0];
          const insEl = document.getElementById('insights');
          insEl.style.display = 'grid';
          insEl.innerHTML = `
            <div class="insight">
              <div class="insight-label">Best Opening</div>
              <div class="insight-name">${best.name}</div>
              <div class="insight-sub">${best.total} games</div>
              <div class="insight-value good">${best.win_rate}% wins</div>
            </div>
            <div class="insight">
              <div class="insight-label">Worst Opening</div>
              <div class="insight-name">${worst.name}</div>
              <div class="insight-sub">${worst.total} games</div>
              <div class="insight-value bad">${worst.win_rate}% wins</div>
            </div>
          `;
        }

        // ── Overall doughnut ──────────────────────────────────────────────
        const ov = d.overall || {};
        chart('chart-overall', 'doughnut', {
          labels: ['Wins', 'Draws', 'Losses'],
          datasets: [{
            data: [ov.win || 0, ov.draw || 0, ov.loss || 0],
            backgroundColor: [C.win, C.draw, C.loss],
            borderWidth: 0
          }]
        }, { scales: {} });

        // ── Win rate by colour ────────────────────────────────────────────
        chart('chart-color', 'bar', {
          labels: ['White', 'Black'],
          datasets: [{
            label: 'Win Rate %',
            data: [d.by_color?.white?.win_rate ?? 0, d.by_color?.black?.win_rate ?? 0],
            backgroundColor: [C.blue, C.purple],
            borderRadius: 6
          }]
        }, {
          scales: {
            x: BASE_OPTS.scales.x,
            y: pct({ ...BASE_OPTS.scales.y })
          },
          plugins: { legend: { display: false } }
        });

        // ── Win rate over time ────────────────────────────────────────────
        const ot = d.over_time || [];
        chart('chart-time', 'line', {
          labels: ot.map(r => r.month),
          datasets: [{
            label: 'Win Rate %',
            data: ot.map(r => r.win_rate),
            borderColor: C.blue,
            backgroundColor: C.winBg,
            fill: true,
            tension: 0.3,
            pointRadius: 3
          }, {
            label: 'Games played',
            data: ot.map(r => r.total),
            borderColor: C.purple,
            backgroundColor: 'transparent',
            tension: 0.3,
            pointRadius: 3,
            yAxisID: 'y2'
          }]
        }, {
          scales: {
            x: BASE_OPTS.scales.x,
            y: { ...pct(BASE_OPTS.scales.y), position: 'left' },
            y2: { position: 'right', ticks: { color: '#999' }, grid: { drawOnChartArea: false } }
          }
        });

        // ── Top openings — stacked wins/draws/losses ──────────────────────
        const labels = op.map(o => o.name.length > 28 ? o.name.slice(0, 26) + '…' : o.name);
        chart('chart-openings', 'bar', {
          labels,
          datasets: [
            {
              label: 'Wins',
              data: op.map(o => o.wins),
              backgroundColor: C.win,
              borderRadius: 2
            },
            {
              label: 'Draws',
              data: op.map(o => o.draws),
              backgroundColor: C.draw,
              borderRadius: 2
            },
            {
              label: 'Losses',
              data: op.map(o => o.losses),
              backgroundColor: C.loss,
              borderRadius: 2
            }
          ]
        }, {
          scales: {
            x: { ...BASE_OPTS.scales.x, stacked: true },
            y: { ...BASE_OPTS.scales.y, stacked: true }
          },
          plugins: { legend: { labels: { color: '#ccc', font: { size: 12 } } } }
        });

        // ── Time control ──────────────────────────────────────────────────
        const tc = d.by_time_control || [];
        chart('chart-tc', 'doughnut', {
          labels: tc.map(t => `${t.control} (${t.total})`),
          datasets: [{
            data: tc.map(t => t.total),
            backgroundColor: [C.blue, C.purple, C.win, C.draw, C.loss],
            borderWidth: 0
          }]
        }, { scales: {} });
      })
      .catch(() => {
        document.getElementById('loading').textContent =
          'Could not load stats — is app.py running?';
      });
  </script>
</body>
</html>
