name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # ruff and mypy are pinned because their verdict IS the gate: a new
          # release can fail a commit that nobody touched. That is not a theory
          # here -- GraphRecords, which had the same unpinned install, went from
          # green to 55 lint errors purely because ruff 0.16.1 shipped. Both
          # versions below were verified against this exact tree (v2.2.0): ruff
          # clean, mypy strict clean over 13 source files, 293 tests passing.
          # pytest is deliberately left unpinned -- a runner upgrade does not
          # change whether the code is correct, it just runs the same assertions.
          pip install pytest ruff==0.16.1 mypy==2.3.0
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy --strict)
        run: mypy
      - name: Test
        # No -q here. pyproject already sets addopts = "-q", and a second one
        # suppresses the summary line, so the log showed rows of dots and never
        # said how many tests ran. In a repository whose product is verification
        # that is the one line worth keeping.
        run: pytest
  # The gitleaks binary directly rather than gitleaks-action, and the whole
  # history rather than a diff. The action scans only the range
  # <before>^..<after> that a push touched, so a secret committed earlier and
  # never edited again is never looked at; and on a repository's first push the
  # parent of the root commit does not exist, so it fails outright.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: gitleaks detect --source . --redact --exit-code 1 --log-opts=--all
