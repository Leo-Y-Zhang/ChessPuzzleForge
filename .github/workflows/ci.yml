name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # ruff and mypy are pinned because their verdict IS the gate: a new
          # release can fail a commit that nobody touched. That is not a theory
          # here -- GraphRecords, which had the same unpinned install, went from
          # green to 55 lint errors purely because ruff 0.16.1 shipped. Both
          # versions below were verified against this exact tree (v2.2.0): ruff
          # clean, mypy strict clean over 13 source files, 289 tests passing.
          # pytest is deliberately left unpinned -- a runner upgrade does not
          # change whether the code is correct, it just runs the same assertions.
          pip install pytest ruff==0.16.1 mypy==2.3.0
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy --strict)
        run: mypy
      - name: Test
        run: pytest -q
